<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title><!--KELLY_SHOP--> · talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:#141516; --surface:#1b1e20; --surface2:#22262a; --border:#3c4348; --borderSoft:#2f3539;
    --text:#f3efe6; --dim:#c0bab0; --faint:#847e75;
    --copper:#d08a4b; --copper2:#f0b072; --teal:#3cc9b0; --blue:#5e8be8; --warn:#f0b429; --danger:#f0616d;
    --sans:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
    --orb: clamp(240px, 40vmin, 360px);
  }
  <!--KELLY_ACCENT-->
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--sans); overflow:hidden; height:100dvh;
    background-image:radial-gradient(ellipse 70% 45% at 50% 18%, rgba(208,138,75,.10), transparent 70%); }
  button { font:inherit; cursor:pointer; color:inherit; }
  button:focus-visible { outline:2px solid var(--copper); outline-offset:3px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .app { height:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; position:relative; }

  #mute { position:fixed; top:14px; right:14px; width:40px; height:40px; border-radius:12px; border:1px solid var(--borderSoft); background:var(--surface); display:grid; place-items:center; color:var(--dim); z-index:5; }
  #mute:hover { background:var(--surface2); color:var(--text); }
  #mute[aria-pressed="true"] { background:rgba(208,138,75,.16); color:var(--copper2); border-color:rgba(208,138,75,.4); }
  #mute svg { width:18px; height:18px; }

  #talk { position:relative; width:var(--orb); height:var(--orb); border-radius:50%; border:0; padding:0; background:transparent; display:grid; place-items:center; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
  #talk canvas { position:absolute; inset:-40%; width:180%; height:180%; pointer-events:none; }
  #talk .glyph { position:relative; width:calc(var(--orb) * .17); height:calc(var(--orb) * .17); color:var(--text); transition:transform .25s ease, color .25s ease; filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  #talk:hover .glyph { transform:scale(1.06); }
  #talk[aria-pressed="true"] .glyph { color:#fff; }
  #talk:focus-visible { outline:2px solid var(--copper); outline-offset:8px; }

  .status { text-align:center; min-height:26px; }
  .status strong { display:block; font:700 clamp(16px,2.4vw,20px)/1.2 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:.005em; color:var(--dim); }
  .status[data-mode="listening"] strong { color:var(--copper2); }
  .status[data-mode="speaking"] strong, .status[data-mode="greeting"] strong { color:var(--teal); }
  .status[data-mode="error"] strong { color:var(--danger); }

  .gallery { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; -webkit-overflow-scrolling:touch; max-width:min(760px,92vw); }
  .gallery[hidden] { display:none; }
  .gallery-card { flex:0 0 200px; scroll-snap-align:start; border:1px solid var(--borderSoft); border-radius:12px; overflow:hidden; background:var(--surface2); cursor:pointer; }
  .gallery-card img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; background:var(--surface2); }
  .gallery-card .cap { padding:8px 10px; }
  .gallery-card .chip { display:inline-block; font:600 10.5px var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--copper2); background:rgba(208,138,75,.14); border-radius:999px; padding:2px 8px; margin-bottom:4px; }
  .gallery-card .line { font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:640px) { .gallery-card { flex-basis:70vw; } }

  dialog#lightbox { border:0; padding:0; margin:auto; width:100vw; height:100vh; max-width:100vw; max-height:100vh; background:#0b0c0d; }
  dialog#lightbox::backdrop { background:rgba(0,0,0,.9); }
  #lightbox .lb-stage { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #lightbox img { max-width:min(94vw,700px); max-height:70vh; object-fit:contain; border-radius:10px; }
  #lightbox .lb-cap { color:var(--text); text-align:center; margin-top:14px; max-width:80vw; }
  #lightbox .lb-cap .chip { display:inline-block; font:600 11px var(--mono); text-transform:uppercase; color:var(--copper2); background:rgba(208,138,75,.16); border-radius:999px; padding:2px 9px; margin-bottom:6px; }
  #lightbox .lb-close, #lightbox .lb-nav { position:absolute; border:1px solid var(--border); background:rgba(27,30,32,.85); color:var(--text); border-radius:999px; width:44px; height:44px; display:grid; place-items:center; font-size:20px; }
  #lightbox .lb-close { top:16px; right:16px; }
  #lightbox .lb-prev { left:16px; top:50%; transform:translateY(-50%); }
  #lightbox .lb-next { right:16px; top:50%; transform:translateY(-50%); }

  .captions { width:min(680px,92vw); text-align:center; position:fixed; bottom:max(14px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; }
  .captions[hidden] { display:none; }
  #heard { font:12px var(--mono); color:var(--faint); margin:0; max-width:60ch; overflow-wrap:anywhere; }
  #reply { font:13px var(--sans); color:var(--dim); margin:0; max-width:60ch; overflow-wrap:anywhere; }

  audio#audioPlayback { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:min(320px,90%); height:34px; filter:invert(.92) hue-rotate(180deg) saturate(.6); border-radius:999px; z-index:4; }
  audio#audioPlayback[hidden] { display:none; }

  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <span class="sr-only" aria-hidden="true"><!--KELLY_MARK--> <!--KELLY_SHOP--></span>

  <button id="mute" type="button" aria-pressed="false" aria-label="Mute Kelly's voice">
    <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
    </svg>
  </button>

  <button id="talk" type="button" aria-pressed="false" aria-label="Tap to talk">
    <canvas id="orbCanvas" aria-hidden="true"></canvas>
    <svg class="glyph" id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line>
    </svg>
  </button>

  <div class="status" id="status" aria-live="polite"><strong id="state">Tap to talk</strong></div>

  <div class="gallery" id="gallery" hidden aria-label="Suggested designs"></div>

  <div class="captions" id="captions" hidden>
    <p id="heard"></p>
    <p id="reply" aria-live="polite"></p>
  </div>

  <audio id="audioPlayback" preload="metadata" aria-label="Kelly speech playback" controls hidden></audio>
</div>

<dialog id="lightbox" aria-label="Design preview">
  <div class="lb-stage">
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Previous design">‹</button>
    <img id="lbImg" alt="">
    <div class="lb-cap"><span class="chip" id="lbChip"></span><div id="lbText"></div></div>
    <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Next design">›</button>
  </div>
</dialog>

<script src="/vendor/vad/bundle.min.js"></script>
<script>
/* ---------- The orb ----------
 * Copied verbatim from counter.html: layered translucent blobs whose outlines ripple with a
 * few slow sines. `level` (0..1) comes from a live analyser on the microphone, or on Kelly's
 * playback, so silence is calm and speech makes the rings swell. No library, one
 * requestAnimationFrame, paused when the tab is hidden, and a still ring when the person
 * prefers reduced motion.
 */
const KellyOrb = (() => {
  const BLOBS = [
    { rgb:[208,138,75],  base:.66, k:[.10,.06,.04], f:[3,5,2],  s:[.55,-.37,.23], p:0.0, drift:.11 },
    { rgb:[240,176,114], base:.56, k:[.08,.05,.05], f:[2,4,7],  s:[-.41,.29,.19], p:1.9, drift:-.09 },
    { rgb:[60,201,176],  base:.48, k:[.09,.07,.03], f:[4,3,6],  s:[.33,-.51,.27], p:3.3, drift:.14 },
    { rgb:[94,139,232],  base:.42, k:[.07,.06,.05], f:[5,2,3],  s:[-.29,.44,-.21], p:4.7, drift:-.12 },
    { rgb:[240,97,109],  base:.34, k:[.06,.05,.04], f:[3,6,4],  s:[.47,.25,-.36], p:0.8, drift:.08 },
  ];
  const MOOD = {
    idle:         { alpha:[.50,.40,.46,.40,.16], scale:.86, wobble:.35, spin:.25 },
    recording:    { alpha:[.72,.58,.38,.30,.34], scale:1.0, wobble:1.0, spin:.6 },
    transcribing: { alpha:[.35,.30,.55,.60,.15], scale:.82, wobble:.25, spin:1.8 },
    speaking:     { alpha:[.30,.32,.85,.70,.15], scale:.95, wobble:.9, spin:.5 },
    error:        { alpha:[.30,.25,.10,.10,.95], scale:.9, wobble:.2, spin:.2 },
  };
  function mount(canvas) {
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let state = 'idle', level = 0, shown = 0, raf = 0, dpr = 1, size = 0, t0 = performance.now(), errorAt = -1, alive = true;
    const mix = { alpha:[...MOOD.idle.alpha], scale:MOOD.idle.scale, wobble:MOOD.idle.wobble, spin:MOOD.idle.spin };
    function fit() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      size = Math.max(1, Math.round(rect.width));
      canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
    }
    const ro = 'ResizeObserver' in window ? new ResizeObserver(fit) : null; ro?.observe(canvas); fit();
    function blobPath(cx, cy, r, b, t, wobble, spin) {
      ctx.beginPath();
      const steps = 72, rot = t * b.drift * spin;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2 + rot;
        let d = 0;
        for (let j = 0; j < 3; j++) d += b.k[j] * wobble * Math.sin(b.f[j] * a + t * b.s[j] * 2.2 + b.p);
        const rr = r * (1 + d);
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
    }
    function frame(now) {
      if (!alive) return;
      raf = 0;
      const t = (now - t0) / 1000;
      shown += (level - shown) * (level > shown ? .38 : .07);
      const mood = MOOD[state] || MOOD.idle;
      for (let i = 0; i < 5; i++) mix.alpha[i] += (mood.alpha[i] - mix.alpha[i]) * .06;
      mix.scale += (mood.scale - mix.scale) * .06; mix.wobble += (mood.wobble - mix.wobble) * .08; mix.spin += (mood.spin - mix.spin) * .05;
      const W = canvas.width, c = W / 2, R = W / 3.6;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W);
      const breath = reduced ? 0 : Math.sin(t * (Math.PI * 2 / 4.2)) * .025;
      const live = state === 'recording' || state === 'speaking' ? shown : 0;
      const scale = mix.scale * (1 + breath + live * .24);
      const errorFlash = errorAt >= 0 ? Math.max(0, 1 - (t - errorAt) / .9) : 0;
      ctx.globalCompositeOperation = 'screen';
      ctx.filter = 'blur(' + (W * (reduced ? .012 : .016)) + 'px)';
      for (let i = 0; i < 5; i++) {
        const b = BLOBS[i];
        const a = Math.min(1, mix.alpha[i] + (i === 4 ? errorFlash : 0) + live * (i < 2 ? .15 : i === 2 ? .12 : .06));
        if (a < .02) continue;
        const wobble = reduced ? 0 : mix.wobble + live * 1.6;
        const r = R * (.78 + .07 * i) * scale * (1 + (reduced ? 0 : .02 * Math.sin(t * .8 + i)));
        const swing = R * (.12 + .10 * mix.spin + live * .08);
        const ox = reduced ? 0 : Math.cos(t * .35 + b.p) * swing, oy = reduced ? 0 : Math.sin(t * .29 + b.p) * swing;
        const g = ctx.createRadialGradient(c + ox, c + oy, r * .4, c + ox, c + oy, r);
        g.addColorStop(0, `rgba(${b.rgb},${a * .35})`); g.addColorStop(.62, `rgba(${b.rgb},${a})`); g.addColorStop(1, `rgba(${b.rgb},0)`);
        ctx.fillStyle = g;
        blobPath(c + ox, c + oy, r, b, reduced ? 0 : t, wobble, mix.spin);
        ctx.fill();
      }
      ctx.filter = 'none';
      if (state === 'transcribing' && !reduced && ctx.createConicGradient) {
        const g = ctx.createConicGradient(t * 3.2, c, c);
        g.addColorStop(0, 'rgba(94,139,232,0)'); g.addColorStop(.7, 'rgba(94,139,232,0)'); g.addColorStop(.92, 'rgba(240,176,114,.9)'); g.addColorStop(1, 'rgba(94,139,232,0)');
        ctx.strokeStyle = g; ctx.lineWidth = W * .012; ctx.beginPath(); ctx.arc(c, c, R * .9 * scale, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      const inner = R * .52 * (1 + live * .06);
      const disc = ctx.createRadialGradient(c, c - inner * .3, inner * .1, c, c, inner);
      disc.addColorStop(0, 'rgba(34,38,42,.96)'); disc.addColorStop(1, 'rgba(20,21,22,.94)');
      ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(c, c, inner, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = state === 'recording' ? `rgba(240,176,114,${.35 + live * .5})` : 'rgba(255,255,255,.08)'; ctx.lineWidth = Math.max(1, W * .004); ctx.stroke();
      if (!reduced || state !== 'idle') raf = requestAnimationFrame(frame);
    }
    function kick() { if (!raf && alive && !document.hidden) raf = requestAnimationFrame(frame); }
    document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else kick(); });
    kick();
    return {
      setState(next) {
        if (next === 'error') { errorAt = (performance.now() - t0) / 1000; next = 'idle'; }
        state = next in MOOD ? next : 'idle';
        if (state !== 'recording' && state !== 'speaking') level = 0;
        kick();
      },
      setLevel(v) { level = Math.max(0, Math.min(1, Number(v) || 0)); kick(); },
      get state() { return state; },
      destroy() { alive = false; cancelAnimationFrame(raf); ro?.disconnect(); },
    };
  }
  return { mount };
})();
window.KellyOrb = KellyOrb;

(() => {
  const $ = (id) => document.getElementById(id);
  const talkBtn = $('talk'), status = $('status'), stateEl = $('state');
  const muteBtn = $('mute'), galleryEl = $('gallery');
  const captionsEl = $('captions'), heardEl = $('heard'), replyEl = $('reply');
  const playback = $('audioPlayback');
  const orb = KellyOrb.mount($('orbCanvas'));

  const TARGET_RATE = 16000;

  /* Testing hook: every timing constant and threshold is overridable so a headless run
     (fake microphone, no real silence) can drive the state machine deterministically. */
  const testing = {
    speechMs: 250,
    silenceMs: 700,
    longSilenceMs: 1400,
    longSilenceAfterMs: 4000,
    hardCapMs: 25000,
    repromptMs: 8000,
    sleepMs: 15000,
    rearmMs: 300,
    speechThreshold: .12,
    silenceThreshold: .06,
    floor: .008,
    levelOverride: null,
    get vadMode() { return vadMode; },
    get micActive() { return !!(stream && stream.getTracks().some(t => t.readyState === 'live')); },
  };
  window.KellyTalk = {
    testing,
    get state() { return state; },
  };

  /* ---------- captions (query flag) ---------- */
  const captionsOn = new URLSearchParams(location.search).get('captions') === '1';
  if (captionsOn) captionsEl.hidden = false;
  function clearCaptions() { heardEl.textContent = ''; replyEl.textContent = ''; }
  function setHeard(text) { heardEl.textContent = text || ''; }
  function setReply(text) { replyEl.textContent = text || ''; }

  /* ---------- mute ---------- */
  let muted = false;
  try { muted = localStorage.getItem('kelly.talk.muted') === '1'; } catch {}
  function applyMuted() {
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? "Unmute Kelly's voice" : "Mute Kelly's voice");
  }
  applyMuted();
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('kelly.talk.muted', muted ? '1' : '0'); } catch {}
    applyMuted();
  });

  /* ---------- state ---------- */
  let state = 'idle'; // idle | greeting | listening | thinking | speaking
  let sessionId = 0, sessionActive = false;
  let stream = null, mimeType = null;
  let meterCtx = null, analyser = null;
  let playCtx = null, playAnalyser = null, playRaf = 0;
  let listenRaf = 0;
  let capturing = false, recorder = null, chunks = [], recordingStartedAt = 0;
  let speechSince = 0, silenceSince = 0;
  let lastActivityAt = 0, repromptedYet = false, repromptAt = 0;
  let playbackBusy = false;
  let speaking = false, speakAbort = null, playQueue = [], playingUrl = null, activePlaybackAbort = null;
  let vadMode = 'energy', sileroVad = null;

  function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

  function paintOrb() {
    let mood = 'idle';
    if (state === 'listening') mood = capturing ? 'recording' : 'idle';
    else if (state === 'thinking') mood = 'transcribing';
    else if (state === 'speaking' || state === 'greeting') mood = 'speaking';
    orb.setState(mood);
  }
  function setState(next, label) {
    state = next;
    status.dataset.mode = next;
    if (label != null) stateEl.textContent = label;
    paintOrb();
  }
  function setCapturing(value) { capturing = value; paintOrb(); }

  /* ---------- mic level metering ---------- */
  function startMeter() {
    try {
      meterCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = meterCtx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = .5;
      meterCtx.createMediaStreamSource(stream).connect(analyser);
      if (meterCtx.state === 'suspended') meterCtx.resume().catch(() => {});
    } catch { meterCtx = null; analyser = null; }
  }
  function stopMeter() {
    if (meterCtx) { const old = meterCtx; meterCtx = null; analyser = null; old.close().catch(() => {}); }
  }
  function readLevel() {
    if (testing.levelOverride != null) return testing.levelOverride;
    if (!analyser) return 0;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    return Math.max(0, Math.min(1, (rms - testing.floor) / .16));
  }

  /* ---------- playback metering (greeting, reprompt, and chunked replies share this) ---------- */
  function ensurePlayMeter() {
    if (playAnalyser) return;
    try {
      playCtx = playCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (playCtx.state !== 'running') { playCtx.resume().catch(() => {}); if (playCtx.state !== 'running') return; }
      const source = playCtx.createMediaElementSource(playback);
      playAnalyser = playCtx.createAnalyser(); playAnalyser.fftSize = 512; playAnalyser.smoothingTimeConstant = .6;
      source.connect(playAnalyser); playAnalyser.connect(playCtx.destination);
    } catch { playAnalyser = null; }
  }
  function meterFrom(sourceAnalyser, target, floor, span) {
    const buffer = new Float32Array(sourceAnalyser.fftSize);
    return () => {
      sourceAnalyser.getFloatTimeDomainData(buffer);
      let sum = 0; for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
      const rms = Math.sqrt(sum / buffer.length);
      target(Math.sqrt(Math.max(0, Math.min(1, (rms - floor) / span))));
    };
  }
  function startPlayMeter() {
    cancelAnimationFrame(playRaf);
    const read = playAnalyser ? meterFrom(playAnalyser, (v) => orb.setLevel(v), .01, .22) : null;
    const t0 = performance.now();
    const tick = () => {
      if (playback.paused || playback.ended) { orb.setLevel(0); return; }
      if (read) read(); else orb.setLevel(.35 + .3 * Math.abs(Math.sin((performance.now() - t0) / 260)));
      playRaf = requestAnimationFrame(tick);
    };
    playRaf = requestAnimationFrame(tick);
  }
  playback.onplay = () => { playCtx?.resume?.().catch(() => {}); startPlayMeter(); };

  /* ---------- single-file playback: greeting and the "still there" reprompt ---------- */
  function playSingle(blob) {
    return new Promise((resolve) => {
      if (playingUrl) { URL.revokeObjectURL(playingUrl); playingUrl = null; }
      playingUrl = URL.createObjectURL(blob);
      playback.src = playingUrl;
      let done = false;
      const finish = () => {
        if (done) return; done = true; activePlaybackAbort = null;
        if (playingUrl) { URL.revokeObjectURL(playingUrl); playingUrl = null; }
        playback.onended = playback.onerror = null;
        playback.hidden = true;
        resolve();
      };
      activePlaybackAbort = finish;
      playback.onended = finish;
      playback.onerror = finish;
      playback.play().then(() => { playback.hidden = true; }).catch((error) => {
        if (error && error.name === 'NotAllowedError') { playback.hidden = false; }
        else finish();
      });
    });
  }
  async function playPrompt(kind) {
    playbackBusy = true;
    try {
      const response = await fetch(`/api/voice/${kind}`, { credentials: 'same-origin' });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size > 44) await playSingle(blob);
      }
    } catch {}
    playbackBusy = false;
    await sleep(testing.rearmMs);
  }

  /* ---------- chunked reply playback (identical framing to counter.html) ---------- */
  function stopSpeaking() {
    speakAbort?.abort(); speakAbort = null;
    activePlaybackAbort?.(); activePlaybackAbort = null;
    playQueue = [];
    cancelAnimationFrame(playRaf); orb.setLevel(0);
    playback.onended = playback.onerror = null;
    playback.pause(); playback.removeAttribute('src'); playback.load(); playback.hidden = true;
    if (playingUrl) { URL.revokeObjectURL(playingUrl); playingUrl = null; }
    speaking = false;
  }
  function playNextFrame() {
    if (!playQueue.length) return;
    const blob = playQueue.shift();
    playingUrl = URL.createObjectURL(blob);
    playback.src = playingUrl;
    playback.onended = () => { URL.revokeObjectURL(playingUrl); playingUrl = null; playNextFrame(); };
    playback.onerror = () => {};
    playback.play().catch((error) => { if (error.name === 'NotAllowedError') playback.hidden = false; });
  }
  function queueFrame(blob) {
    const wasEmpty = playQueue.length === 0 && !playingUrl;
    playQueue.push(blob);
    if (wasEmpty) playNextFrame();
  }
  async function readFramed(reader) {
    let buf = new Uint8Array(0);
    for (;;) {
      const { value, done } = await reader.read();
      if (value) {
        const merged = new Uint8Array(buf.length + value.length);
        merged.set(buf); merged.set(value, buf.length); buf = merged;
      }
      while (buf.length >= 4) {
        const len = new DataView(buf.buffer, buf.byteOffset, 4).getUint32(0, false);
        if (buf.length < 4 + len) break;
        const frame = buf.slice(4, 4 + len);
        buf = buf.slice(4 + len);
        queueFrame(new Blob([frame], { type: 'audio/wav' }));
      }
      if (done) break;
    }
  }
  async function speakReply(id, text) {
    if (!text || !text.trim()) { if (id === sessionId) enterListening(true); return; }
    stopSpeaking();
    ensurePlayMeter();
    speaking = true; speakAbort = new AbortController();
    setState('speaking', 'Speaking');
    setReply(text);
    try {
      const response = await fetch('/api/voice/speak', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text, language: 'en', chunk: true }), signal: speakAbort.signal,
      });
      if (!response.ok) { let data = {}; try { data = await response.json(); } catch {} throw new Error(data.error || 'Speech is unavailable.'); }
      const ct = response.headers.get('content-type') || '';
      if (ct.includes('application/x-kelly-wav-seq') && response.body) await readFramed(response.body.getReader());
      else { const audio = await response.blob(); if (audio.size > 44) queueFrame(audio); }
      await new Promise((resolve) => {
        const originalOnEnded = playback.onended;
        playback.onended = () => { originalOnEnded?.(); if (!playQueue.length) { speaking = false; resolve(); } };
        const check = () => { if (!playQueue.length && (playback.paused || playback.ended) && !speaking) return resolve(); requestAnimationFrame(check); };
        check();
      });
    } catch (error) {
      speaking = false;
      if (error && error.name === 'AbortError') return; // interrupted by a press; caller already transitioned
    }
    if (id === sessionId && state === 'speaking') enterListening(true);
  }

  /* ---------- WAV encoding (copied from counter.html) ---------- */
  function resample(input, fromRate) {
    if (fromRate === TARGET_RATE) return input;
    const ratio = fromRate / TARGET_RATE, length = Math.floor(input.length / ratio), output = new Float32Array(length);
    for (let i = 0; i < length; i++) {
      const start = Math.floor(i * ratio), end = Math.max(start + 1, Math.floor((i + 1) * ratio));
      let sum = 0; for (let j = start; j < end && j < input.length; j++) sum += input[j];
      output[i] = sum / (end - start);
    }
    return output;
  }
  function toWav(parts, fromRate) {
    const size = parts.reduce((total, part) => total + part.length, 0), joined = new Float32Array(size);
    let offset = 0; for (const part of parts) { joined.set(part, offset); offset += part.length; }
    const floats = resample(joined, fromRate);
    const buffer = new ArrayBuffer(44 + floats.length * 2), view = new DataView(buffer);
    const write = (at, text) => { for (let i = 0; i < text.length; i++) view.setUint8(at + i, text.charCodeAt(i)); };
    write(0, 'RIFF'); view.setUint32(4, 36 + floats.length * 2, true); write(8, 'WAVE'); write(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, TARGET_RATE, true); view.setUint32(28, TARGET_RATE * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); write(36, 'data'); view.setUint32(40, floats.length * 2, true);
    for (let i = 0; i < floats.length; i++) { const sample = Math.max(-1, Math.min(1, floats[i])); view.setInt16(44 + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true); }
    return new Blob([buffer], { type: 'audio/wav' });
  }

  /* ---------- design gallery + lightbox (copied from counter.html) ---------- */
  const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let lightboxSet = [];
  const lightbox = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg'), lbChip = document.getElementById('lbChip'), lbText = document.getElementById('lbText');
  function openLightbox(set, index) {
    lightboxSet = set; showLightbox(index);
    if (typeof lightbox.showModal === 'function') lightbox.showModal(); else lightbox.setAttribute('open', '');
  }
  function showLightbox(index) {
    const d = lightboxSet[(index + lightboxSet.length) % lightboxSet.length];
    if (!d) return;
    lightbox.dataset.index = String((index + lightboxSet.length) % lightboxSet.length);
    lbImg.src = d.url || d.thumb || ''; lbImg.alt = d.caption || d.category || 'design';
    lbChip.textContent = d.category || ''; lbText.textContent = d.caption || '';
  }
  document.getElementById('lbClose').addEventListener('click', () => lightbox.close ? lightbox.close() : lightbox.removeAttribute('open'));
  document.getElementById('lbPrev').addEventListener('click', () => showLightbox(Number(lightbox.dataset.index || 0) - 1));
  document.getElementById('lbNext').addEventListener('click', () => showLightbox(Number(lightbox.dataset.index || 0) + 1));
  lightbox.addEventListener('click', (event) => { if (event.target === lightbox) (lightbox.close ? lightbox.close() : lightbox.removeAttribute('open')); });
  lightbox.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight') showLightbox(Number(lightbox.dataset.index || 0) + 1);
    else if (event.key === 'ArrowLeft') showLightbox(Number(lightbox.dataset.index || 0) - 1);
    else if (event.key === 'Escape') { event.stopPropagation(); (lightbox.close ? lightbox.close() : lightbox.removeAttribute('open')); }
  });
  let touchStartX = null;
  lightbox.addEventListener('touchstart', (event) => { touchStartX = event.touches[0]?.clientX ?? null; }, { passive: true });
  lightbox.addEventListener('touchend', (event) => {
    if (touchStartX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchStartX) - touchStartX;
    if (Math.abs(dx) > 40) showLightbox(Number(lightbox.dataset.index || 0) + (dx < 0 ? 1 : -1));
    touchStartX = null;
  }, { passive: true });
  function showGallery(designs) {
    galleryEl.innerHTML = '';
    if (!designs || !designs.length) return;
    designs.forEach((d, i) => {
      const card = document.createElement('div'); card.className = 'gallery-card'; card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'Open ' + (d.caption || d.category));
      card.innerHTML = '<img src="' + esc(d.thumb || d.url || '') + '" alt="' + esc(d.caption || d.category || '') + '" loading="lazy">'
        + '<div class="cap"><span class="chip">' + esc(d.category || '') + '</span><div class="line">' + esc(d.caption || '') + '</div></div>';
      card.addEventListener('click', () => openLightbox(designs, i));
      card.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openLightbox(designs, i); } });
      galleryEl.appendChild(card);
    });
    galleryEl.hidden = false;
  }
  function hideGallery() { galleryEl.hidden = true; galleryEl.innerHTML = ''; }

  /* ---------- listening watchdog: energy VAD speech onset/offset, plus the shared
     reprompt/sleep silence timers that also apply when Silero drives speech events ---------- */
  function listenLoop() {
    listenRaf = 0;
    if (state !== 'listening') return;
    const now = performance.now();
    if (!playbackBusy) {
      if (vadMode === 'energy') {
        const level = readLevel();
        orb.setLevel(level);
        if (capturing) {
          const duration = now - recordingStartedAt;
          const silenceLimit = duration > testing.longSilenceAfterMs ? testing.longSilenceMs : testing.silenceMs;
          if (level >= testing.speechThreshold) silenceSince = 0;
          else { if (!silenceSince) silenceSince = now; if (now - silenceSince >= silenceLimit) { endCapture(); return; } }
          if (duration >= testing.hardCapMs) { endCapture(); return; }
        } else {
          if (level >= testing.speechThreshold) {
            if (!speechSince) speechSince = now;
            if (now - speechSince >= testing.speechMs) beginCapture();
          } else speechSince = 0;
        }
      }
      if (!capturing) {
        if (!repromptedYet) {
          if (now - lastActivityAt >= testing.repromptMs) { triggerReprompt(); return; }
        } else if (now - repromptAt >= testing.sleepMs) { endSessionSilently(); return; }
      }
    } else {
      orb.setLevel(0);
    }
    listenRaf = requestAnimationFrame(listenLoop);
  }
  function enterListening(resetWatchdog) {
    setState('listening', 'Listening');
    setCapturing(false);
    speechSince = 0; silenceSince = 0;
    if (resetWatchdog) { lastActivityAt = performance.now(); repromptedYet = false; repromptAt = 0; }
    if (!listenRaf) listenRaf = requestAnimationFrame(listenLoop);
  }
  async function triggerReprompt() {
    const id = sessionId;
    repromptedYet = true;
    stateEl.textContent = 'Still there?';
    await playPrompt('reprompt');
    if (id !== sessionId || state !== 'listening') return;
    repromptAt = performance.now();
    stateEl.textContent = 'Listening';
    if (!listenRaf) listenRaf = requestAnimationFrame(listenLoop);
  }
  async function endSessionSilently() {
    const id = sessionId;
    await chime();
    if (id !== sessionId) return;
    teardownSession();
  }
  function chime() {
    return new Promise((resolve) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 440;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.55);
        osc.onended = () => { ctx.close().catch(() => {}); resolve(); };
      } catch { resolve(); }
    });
  }

  /* ---------- energy-VAD capture: one MediaRecorder per utterance on the session's stream ---------- */
  function beginCapture() {
    setCapturing(true);
    recordingStartedAt = performance.now(); silenceSince = 0; chunks = [];
    hideGallery();
    const id = sessionId;
    try {
      recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      recorder.ondataavailable = (event) => { if (id === sessionId && event.data.size) chunks.push(event.data); };
      recorder.onstop = () => { if (id === sessionId) void handleCaptureStop(id); };
      recorder.start(250);
    } catch { setCapturing(false); }
  }
  function endCapture() {
    if (!capturing) return;
    setCapturing(false);
    setState('thinking', 'Thinking');
    try { if (recorder && recorder.state !== 'inactive') recorder.stop(); else void handleCaptureStop(sessionId); }
    catch { void handleCaptureStop(sessionId); }
  }
  async function handleCaptureStop(id) {
    if (id !== sessionId) return;
    const encoded = new Blob(chunks, { type: recorder?.mimeType || 'audio/webm' });
    chunks = [];
    if (!encoded.size) { if (id === sessionId) enterListening(false); return; }
    try {
      const decoder = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await decoder.decodeAudioData(await encoded.arrayBuffer());
      if (id !== sessionId) { decoder.close().catch(() => {}); return; }
      const mono = new Float32Array(decoded.length);
      for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
        const samples = decoded.getChannelData(channel);
        for (let i = 0; i < mono.length; i++) mono[i] += samples[i] / decoded.numberOfChannels;
      }
      await decoder.close();
      if (!decoded.length) { enterListening(false); return; }
      await transcribeAndRespond(id, toWav([mono], decoded.sampleRate));
    } catch { if (id === sessionId) enterListening(false); }
  }
  async function transcribeAndRespond(id, wavBlob) {
    try {
      const response = await fetch('/api/voice/transcribe', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'audio/wav', 'x-kelly-voice-language': 'auto' }, body: wavBlob,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Transcription failed.');
      const text = (data.text || '').trim();
      if (id !== sessionId) return;
      setHeard(text);
      if (!text) { enterListening(false); return; }
      await sendPrompt(id, text, data.transcriptId || undefined);
    } catch { if (id === sessionId) enterListening(false); }
  }

  /* ---------- Silero speech events (best-effort; falls back to energy VAD above) ---------- */
  function onSileroSpeechStart() {
    if (state !== 'listening' || capturing) return;
    setCapturing(true); recordingStartedAt = performance.now();
    hideGallery();
  }
  async function onSileroSpeechEnd(audio) {
    if (!capturing) return;
    setCapturing(false);
    const id = sessionId;
    setState('thinking', 'Thinking');
    try { await transcribeAndRespond(id, toWav([audio], TARGET_RATE)); }
    catch { if (id === sessionId) enterListening(false); }
  }
  async function initVad() {
    vadMode = 'energy'; sileroVad = null;
    if (!window.vad || !window.vad.MicVAD) return;
    try {
      const minSpeechFrames = Math.max(1, Math.round(testing.speechMs / 32));
      const redemptionFrames = Math.max(1, Math.round(testing.silenceMs / 32));
      const instance = await window.vad.MicVAD.new({
        stream,
        baseAssetPath: '/vendor/vad/',
        onnxWASMBasePath: '/vendor/vad/',
        positiveSpeechThreshold: .55,
        negativeSpeechThreshold: .35,
        minSpeechFrames,
        redemptionFrames,
        onSpeechStart: onSileroSpeechStart,
        onSpeechEnd: onSileroSpeechEnd,
        onVADMisfire: () => {},
      });
      instance.start();
      sileroVad = instance;
      vadMode = 'silero';
    } catch { vadMode = 'energy'; sileroVad = null; }
  }

  /* ---------- chat turn: SSE spoken / designs / done / error ---------- */
  async function sendPrompt(id, prompt, transcriptId) {
    hideGallery();
    let spokenArrived = false;
    try {
      const response = await fetch('/api/chat/send', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt, voice: true, ...(transcriptId ? { transcriptId } : {}) }),
      });
      if (!response.ok) { let data = {}; try { data = await response.json(); } catch {} throw new Error(data.error || 'Chat request failed.'); }
      const reader = response.body.getReader(), decoder = new TextDecoder(); let pending = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (id !== sessionId) { try { await reader.cancel(); } catch {} return; }
        if (done) break;
        pending += decoder.decode(value, { stream: true });
        const blocks = pending.split('\n\n'); pending = blocks.pop();
        for (const block of blocks) {
          const ev = block.match(/^event: (.+)$/m)?.[1], raw = block.match(/^data: (.+)$/m)?.[1]; if (!raw) continue;
          let data; try { data = JSON.parse(raw); } catch { continue; }
          if (ev === 'spoken') { spokenArrived = true; if (!muted && data.text) void speakReply(id, data.text); else if (muted) setReply(data.text || ''); }
          else if (ev === 'designs') { if (data.designs && data.designs.length) showGallery(data.designs); }
          else if (ev === 'done') {
            if (id !== sessionId) return;
            if (muted) { enterListening(true); }
            else if (!spokenArrived) { if (data.spoken) void speakReply(id, data.spoken); else enterListening(true); }
          } else if (ev === 'error') throw new Error(data.error || 'Chat failed.');
        }
      }
    } catch (error) {
      if (id !== sessionId) return;
      stateEl.textContent = 'Sorry';
      await sleep(1500);
      if (id === sessionId) enterListening(true);
    }
  }

  /* ---------- session lifecycle ---------- */
  async function startSession() {
    if (sessionActive) return;
    sessionId++; const id = sessionId; sessionActive = true;
    hideGallery(); clearCaptions();
    talkBtn.setAttribute('aria-pressed', 'true'); talkBtn.setAttribute('aria-label', 'End session');
    ensurePlayMeter();
    setState('greeting', 'Speaking');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch {
      sessionActive = false; sessionId++;
      talkBtn.setAttribute('aria-pressed', 'false'); talkBtn.setAttribute('aria-label', 'Tap to talk');
      setState('idle', 'Tap to talk');
      return;
    }
    if (id !== sessionId) { stream.getTracks().forEach((t) => t.stop()); return; }
    const supportedTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    mimeType = (window.MediaRecorder && supportedTypes.find((t) => MediaRecorder.isTypeSupported(t))) || null;
    startMeter();
    await initVad();
    if (id !== sessionId) return;
    lastActivityAt = performance.now(); repromptedYet = false; repromptAt = 0;
    await playPrompt('greeting');
    if (id !== sessionId || state !== 'greeting') return;
    enterListening(true);
  }
  function teardownSession() {
    sessionId++;
    sessionActive = false;
    setCapturing(false); speechSince = 0; silenceSince = 0; repromptedYet = false; repromptAt = 0;
    cancelAnimationFrame(listenRaf); listenRaf = 0;
    stopMeter();
    if (recorder) { try { recorder.ondataavailable = recorder.onstop = recorder.onerror = null; if (recorder.state !== 'inactive') recorder.stop(); } catch {} recorder = null; }
    if (sileroVad) { try { sileroVad.pause?.(); sileroVad.destroy?.(); } catch {} sileroVad = null; }
    vadMode = 'energy';
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    stopSpeaking();
    hideGallery(); clearCaptions();
    talkBtn.setAttribute('aria-pressed', 'false'); talkBtn.setAttribute('aria-label', 'Tap to talk');
    setState('idle', 'Tap to talk');
  }
  function endSessionManual() {
    if (capturing) { try { recorder && recorder.state !== 'inactive' && recorder.stop(); } catch {} }
    teardownSession();
  }

  function onPress() {
    if (state === 'idle') void startSession();
    else if (state === 'greeting' || state === 'speaking') { stopSpeaking(); enterListening(true); }
    else if (state === 'listening' || state === 'thinking') endSessionManual();
  }

  /* ---------- input ---------- */
  talkBtn.addEventListener('click', onPress);
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (lightbox.open) return;
      event.preventDefault();
      if (sessionActive) endSessionManual();
      return;
    }
    if (event.code === 'Space') {
      if (document.activeElement === muteBtn) return;
      event.preventDefault();
      onPress();
    }
  });
  window.addEventListener('pagehide', () => { teardownSession(); });
})();
</script>
</body>
</html>
