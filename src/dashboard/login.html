<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry — Sign in</title>
<style>
  :root {
    --bg: #1f1e1b;
    --surface: #262522;
    --surface-2: #2d2c28;
    --border: #3d3c36;
    --border-soft: #34332e;
    --text: #eceae2;
    --text-dim: #a8a69b;
    --text-faint: #7d7b71;
    --accent: #34d399;
    --accent-dim: #1d5c44;
    --danger: #f87171;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }

  main { width: 100%; max-width: 360px; animation: rise .3s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2px; margin-bottom: 22px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .brand small { color: var(--text-faint); font-weight: 400; }

  form {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
  input {
    appearance: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14.5px; font-family: var(--sans);
    transition: border-color .15s;
  }
  input:focus { outline: none; border-color: var(--accent-dim); }
  button {
    appearance: none; border: 1px solid var(--accent-dim); background: var(--accent-dim); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; cursor: pointer; font-family: var(--sans);
    margin-top: 4px; transition: filter .15s;
  }
  button:hover { filter: brightness(1.2); }

  #error {
    display: none; color: var(--danger); font-size: 13px; border: 1px solid var(--danger);
    border-radius: 10px; padding: 8px 11px; background: color-mix(in srgb, var(--danger) 10%, transparent);
  }
  #error.show { display: block; }
  footer { margin-top: 16px; text-align: center; color: var(--text-faint); font-size: 11.5px; font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span>Henry <small>· sign in</small></div>
  <form method="post" action="/login" autocomplete="on">
    <h1>Welcome back</h1>
    <div id="error">Incorrect username or password.</div>
    <label>Username
      <input name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <footer>local access stays open on this machine</footer>
</main>
<script>
  // The page is served straight off disk (read-and-cache, no templating), so the
  // failed-login state rides the query string the POST handler redirects to.
  if (new URLSearchParams(location.search).has("error")) {
    document.getElementById("error").classList.add("show");
  }
</script>
</body>
</html>
