<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry — Knowledge domains</title>
<style>
  :root {
    --bg: #1f1e1b;
    --surface: #262522;
    --surface-2: #2d2c28;
    --border: #3d3c36;
    --border-soft: #34332e;
    --text: #eceae2;
    --text-dim: #a8a69b;
    --text-faint: #7d7b71;
    --accent: #34d399;
    --accent-dim: #1d5c44;
    --danger: #f87171;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100%; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; border-bottom: 1px solid var(--border-soft);
    background: color-mix(in srgb, var(--bg) 88%, black);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .brand small { color: var(--text-faint); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: var(--sans);
    text-decoration: none; display: inline-block; transition: color .15s, border-color .15s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-faint); }

  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin-bottom: 4px; }
  .sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 22px; }

  .card {
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: 14px;
    overflow: hidden;
  }
  .domain-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border-soft);
  }
  .domain-row:last-child { border-bottom: none; }
  .domain-row.off { opacity: .55; }
  .domain-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .domain-name { font-size: 14.5px; font-family: var(--mono); }
  .badge {
    font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent-dim);
    border-radius: 999px; padding: 1.5px 8px; white-space: nowrap;
  }

  /* toggle switch */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; transition: background .15s, border-color .15s;
  }
  .slider::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
    background: var(--text-dim); border-radius: 50%; transition: transform .15s, background .15s;
  }
  .switch input:checked + .slider { background: var(--accent-dim); border-color: var(--accent-dim); }
  .switch input:checked + .slider::before { transform: translateX(18px); background: var(--accent); }
  .switch input:disabled + .slider { cursor: default; opacity: .6; }

  .empty, .error { padding: 40px 16px; text-align: center; color: var(--text-dim); font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>Henry <small>· knowledge domains</small></div>
  <div class="header-right">
    <a class="btn" href="/">Dashboard</a>
    <a class="btn" href="/logout">Sign out</a>
  </div>
</header>

<main>
  <h1>Knowledge domains</h1>
  <p class="sub">Switching a domain off removes it from every surface that reads it, including Henry's own retrieval.</p>
  <div class="card">
    <div id="rows"></div>
    <div class="error" id="error" style="display:none"></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var rows = document.getElementById("rows");
  var errorBox = document.getElementById("error");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render(domains) {
    rows.innerHTML = domains.map(function (d) {
      return '<div class="domain-row' + (d.enabled ? "" : " off") + '" data-domain="' + esc(d.domain) + '">' +
        '<div class="domain-left">' +
          '<span class="domain-name">' + esc(d.domain) + "</span>" +
        "</div>" +
        '<label class="switch">' +
          '<input type="checkbox"' + (d.enabled ? " checked" : "") + ">" +
          '<span class="slider"></span>' +
        "</label>" +
      "</div>";
    }).join("");

    Array.prototype.forEach.call(rows.querySelectorAll(".domain-row"), function (row) {
      var checkbox = row.querySelector("input");
      checkbox.addEventListener("change", function () {
        var domain = row.getAttribute("data-domain");
        var enabled = checkbox.checked;
        checkbox.disabled = true;
        fetch("/api/knowledge/domains", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ domain: domain, enabled: enabled }),
        }).then(function (r) {
          return r.json().then(function (data) {
            if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
            return data;
          });
        }).then(function (domains) {
          render(Array.isArray(domains) ? domains : []);
        }).catch(function (error) {
          checkbox.checked = !enabled; // revert the optimistic UI on failure
          checkbox.disabled = false;
          errorBox.style.display = "";
          errorBox.textContent = "Could not update " + domain + ": " + (error && error.message ? error.message : error);
        });
      });
    });
  }

  fetch("/api/knowledge/domains").then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (domains) {
    render(Array.isArray(domains) ? domains : []);
  }).catch(function (error) {
    errorBox.style.display = "";
    errorBox.textContent = "Could not load knowledge domains: " + (error && error.message ? error.message : error);
  });
})();
</script>
</body>
</html>
