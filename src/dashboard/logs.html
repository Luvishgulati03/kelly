<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry — Logs</title>
<style>
:root{color-scheme:dark;--bg:#050706;--panel:#0a0e0b;--line:#1b2a20;--text:#f3f7f2;--muted:#91a296;--accent:#57e389;--good:#57e389;--warn:#e8bf67;--bad:#ff6f79;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% -12%,rgba(39,119,67,.15),transparent 33rem),var(--bg);color:var(--text);font:13.5px/1.5 ui-sans-serif,system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:12px}
a.back{color:var(--accent);text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none}
.chip.active{background:rgba(87,227,137,.15);color:var(--accent);border-color:var(--accent);font-weight:600}
.chip.errors.active{background:var(--bad);border-color:var(--bad)}
input[type=search]{flex:1;min-width:180px;background:#0f131a;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;font-size:13px}
select{background:#0f131a;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px}
label.follow{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer}
#count{color:var(--muted);font-size:12px;margin-left:auto}
.log{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:74px 158px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;align-items:baseline}
.row:first-child{border-top:0}
.row:hover{background:#1c2230}
.time{font-family:var(--mono);color:var(--muted);font-size:11.5px;white-space:nowrap}
.kind{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);width:fit-content;white-space:nowrap}
.kind.err{color:var(--bad);border-color:var(--bad)}
.kind.mem{color:#b48bff;border-color:#5b4a8a}
.kind.run{color:var(--good);border-color:#2c5c48}
.kind.wf{color:var(--accent);border-color:#3c4a8a}
.kind.telegram{color:#8ddcff;border-color:#2b6a7a}
.kind.ap{color:var(--warn);border-color:#8a6c3c}
.msg{word-break:break-word}
.meta{grid-column:1/-1;display:none;font-family:var(--mono);font-size:11.5px;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;color:#c8d2e4}
.row.open .meta{display:block}
.empty{padding:26px;text-align:center;color:var(--muted)}
</style></head><body><main>
<header>
  <div><h1>Henry / event log</h1><div class="sub">runs, memory, workflows, approvals, failures, and Telegram pipeline messages</div></div>
  <a class="back" href="/">← dashboard</a>
</header>
<div class="bar">
  <span class="chip active" data-cat="all">All</span>
  <span class="chip" data-cat="memory">Memory</span>
  <span class="chip" data-cat="runs">Runs &amp; replies</span>
  <span class="chip" data-cat="workflows">Workflows</span>
  <span class="chip" data-cat="approvals">Approvals</span>
  <span class="chip" data-cat="standup">Standup</span>
  <span class="chip" data-cat="telegram">Telegram</span>
  <span class="chip" data-cat="jobs">Jobs</span>
  <span class="chip errors" data-cat="errors">⚠ Errors only</span>
  <input type="search" id="q" placeholder="search message, kind, metadata…">
  <select id="limit"><option>200</option><option selected>500</option><option>1000</option><option>2000</option></select>
  <label class="follow"><input type="checkbox" id="follow" checked> auto-refresh</label>
  <span id="count"></span>
</div>
<div class="log" id="log"><div class="empty">Loading…</div></div>
</main>
<script>
(function () {
  "use strict";
  var source = new URLSearchParams(location.search).get("source");
  var state = { cat: source === "telegram" ? "telegram" : source === "jobs" ? "jobs" : "all", q: "", rows: [] };
  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.classList.toggle("active", chip.dataset.cat === state.cat);
  });
  var logEl = document.getElementById("log");
  var countEl = document.getElementById("count");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

  function kindClass(row) {
    if (row.kind.endsWith(".failed") || (row.metadata && row.metadata.error)) return "err";
    if (row.metadata && (row.metadata.telegram || row.metadata.bridge || row.metadata.standup)) return "telegram";
    if (row.kind.indexOf("memory.") === 0) return "mem";
    if (row.kind.indexOf("run.") === 0) return "run";
    if (row.kind.indexOf("workflow.") === 0) return "wf";
    if (row.kind.indexOf("approval.") === 0) return "ap";
    return "";
  }
  function inCat(row) {
    var meta = row.metadata || {};
    switch (state.cat) {
      case "all": return true;
      case "errors": return row.kind.endsWith(".failed") || Boolean(meta.error);
      case "memory": return row.kind.indexOf("memory.") === 0;
      case "runs": return row.kind.indexOf("run.") === 0 || row.kind.indexOf("provider.") === 0;
      case "workflows": return row.kind.indexOf("workflow.") === 0;
      case "approvals": return row.kind.indexOf("approval.") === 0;
      case "standup": return Boolean(meta.standup);
      case "telegram": return Boolean(meta.telegram || meta.bridge || meta.standup) || /telegram/i.test(row.kind + " " + row.message);
      case "jobs": return Boolean(meta.scout || meta.jobTracker || meta.mailwatch || meta.applicationId) || row.kind.indexOf("job.") === 0;
      default: return true;
    }
  }
  function matches(row) {
    if (!state.q) return true;
    var hay = (row.kind + " " + row.message + " " + JSON.stringify(row.metadata || {})).toLowerCase();
    return hay.indexOf(state.q) !== -1;
  }

  function render() {
    var rows = state.rows.filter(function (r) { return inCat(r) && matches(r); });
    countEl.textContent = rows.length + " / " + state.rows.length + " events";
    if (!rows.length) { logEl.innerHTML = '<div class="empty">Nothing matches — loosen the filters.</div>'; return; }
    logEl.innerHTML = rows.map(function (r, i) {
      var t = r.timestamp ? r.timestamp.slice(11, 19) : "";
      var day = r.timestamp ? r.timestamp.slice(5, 10) : "";
      return '<div class="row" data-i="' + i + '">' +
        '<span class="time">' + esc(day) + " " + esc(t) + "</span>" +
        '<span class="kind ' + kindClass(r) + '">' + esc(r.kind) + "</span>" +
        '<span class="msg">' + esc(r.message) + "</span>" +
        '<pre class="meta">' + esc(JSON.stringify({ metadata: r.metadata, runId: r.runId, provider: r.provider, role: r.role }, null, 2)) + "</pre>" +
        "</div>";
    }).join("");
    Array.prototype.forEach.call(logEl.querySelectorAll(".row"), function (el) {
      el.addEventListener("click", function () { el.classList.toggle("open"); });
    });
  }

  function load() {
    var limit = document.getElementById("limit").value;
    fetch("/api/logs?limit=" + limit).then(function (r) { return r.json(); }).then(function (data) {
      state.rows = data.events || [];
      render();
    }).catch(function () { logEl.innerHTML = '<div class="empty">Could not load logs — is Henry running?</div>'; });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
    chip.addEventListener("click", function () {
      document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      state.cat = chip.dataset.cat;
      render();
    });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("limit").addEventListener("change", load);
  setInterval(function () { if (document.getElementById("follow").checked && !document.hidden) load(); }, 5000);
  load();
})();
</script>
</body></html>
